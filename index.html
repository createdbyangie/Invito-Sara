<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invito 18 Anni - Sara</title>
  
  <!-- Import dei font Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Playball&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playball', cursive;
      background-color: #000;
    }

    /* --- SCHERMATA 1: BUSTA --- */
    #schermata-busta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-in-out;
      z-index: 10;
      background-color: #f7e6e9;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    .testo-container {
      position: absolute;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 2.2rem;
      line-height: 1.3;
      z-index: 3;
      color: #000000;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .char-fade {
      display: inline-block;
      opacity: 0;
      animation: fadeInChar 0.4s forwards ease-in-out;
    }

    @keyframes fadeInChar {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .area-busta-pulsante {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }

    /* --- SCHERMATA 2: VIDEO FINALE E HOTSPOT --- */
    #schermata-dettagli {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 5;
      overflow: hidden;
    }

    #bg-video-finale {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Contenitore orizzontale per i 3 cerchi in basso */
    .hotspots-container {
      position: absolute;
      z-index: 3;
      width: 90%;
      max-width: 380px;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
    }

    /* Hotspot invisibili e rotondi */
    .hotspot-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      display: block;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* POP-UP MODALE DRESS CODE */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      position: relative;
      background: transparent;
      padding: 0;
      margin: 0;
      width: 95%;
      max-width: 440px;
      text-align: center;
      box-shadow: none;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .popup-graphic {
      width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
