<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invito 18 Anni - Sara</title>
  
  <!-- Import dei font Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playball&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playball', cursive;
      background-color: #000;
    }

    /* --- SCHERMATA 1: BUSTA --- */
    #schermata-busta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-in-out;
      z-index: 10;
      background-color: #f7e6e9;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    .testo-container {
      position: absolute;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 2.2rem;
      line-height: 1.3;
      z-index: 3;
      color: #000000;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .char-fade {
      display: inline-block;
      opacity: 0;
      animation: fadeInChar 0.4s forwards ease-in-out;
    }

    @keyframes fadeInChar {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .area-busta-pulsante {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }

    /* --- SCHERMATA 2: VIDEO FINALE E HOTSPOT --- */
    #schermata-dettagli {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 5;
      overflow: hidden;
    }

    #bg-video-finale {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Contenitore orizzontale per i 3 cerchi in basso */
    .hotspots-container {
      position: absolute;
      z-index: 3;
      width: 90%;
      max-width: 380px;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
    }

    /* Hotspot invisibili e rotondi */
    .hotspot-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      display: block;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* POP-UP MODALE DRESS CODE */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      position: relative;
      background: transparent;
      padding: 0;
      margin: 0;
      width: 95%;
      max-width: 440px;
      text-align: center;
      box-shadow: none;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .popup-graphic {
      width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .close-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 36px;
      height: 36px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      font-weight: bold;
      z-index: 10;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- AUDIO DI SFONDO -->
  <audio id="bg-audio" preload="auto" loop>
    <source src="canzone.mp3" type="audio/mpeg">
  </audio>

  <!-- SCHERMATA 1: VIDEO + BUSTA -->
  <div id="schermata-busta">
    <div id="audio-btn" onclick="toggleAudio(event)">🔇</div>
    <video id="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div id="scritta" class="testo-container"></div>
    <div class="area-busta-pulsante" onclick="apriInvito()"></div>
  </div>

  <!-- SCHERMATA 2: SECONDA PARTE CON VIDEO FINALE -->
  <div id="schermata-dettagli">
    <video id="bg-video-finale" muted playsinline webkit-playsinline preload="auto">
      <source src="videofinale.mp4" type="video/mp4">
    </video>

    <!-- Hotspot orizzontali e rotondi -->
    <div class="hotspots-container">
      <!-- 1. Tasto Dress Code -->
      <button class="hotspot-btn" onclick="openModal('dresscode-modal')"></button>
      
      <!-- 2. Tasto Location -->
      <a href="https://maps.google.com/?q=Villa+Brusa+Villabate" target="_blank" class="hotspot-btn"></a>
      
      <!-- 3. Tasto Conferma Presenza con link esteso corretto -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSc-W5h6_dC8L9z-Y1W2t2Q9xW8vP4K1m3N6j7h9f5s2d3a1g/viewform?usp=header" target="_blank" class="hotspot-btn"></a>
    </div>
  </div>

  <!-- POP-UP DRESS CODE -->
  <div id="dresscode-modal" class="modal" onclick="closeModalOnOuterClick(event, 'dresscode-modal')">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('dresscode-modal')">&times;</span>
      <img src="dresscode.png" alt="Dress Code" class="popup-graphic" onerror="this.style.display='none'">
    </div>
  </div>

  <script>
    const testo = "Clicca sulla busta\nper aprire l’invito.";
    const container = document.getElementById("scritta");
    let index = 0;

    function scriviTestoFluido() {
      if (index < testo.length) {
        const char = testo.charAt(index);
        const span = document.createElement("span");
        
        if (char === "\n") {
          container.appendChild(document.createElement("br"));
        } else {
          if (char === " ") {
            span.innerHTML = "&nbsp;";
          } else {
            span.textContent = char;
          }
          span.className = "char-fade";
          container.appendChild(span);
        }
        
        index++;
        setTimeout(scriviTestoFluido, 70);
      }
    }

    function toggleAudio(event) {
      event.stopPropagation();
      const video = document.getElementById("bg-video");
      const audioBtn = document.getElementById("audio-btn");
      
      if (video.muted) {
        video.muted = false;
        audioBtn.textContent = "🔊";
      } else {
        video.muted = true;
        audioBtn.textContent = "🔇";
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      video.play().catch(function(error) {
        console.log("Autoplay gestito dal browser");
      });
      scriviTestoFluido();
    });

    function apriInvito() {
      const busta = document.getElementById("schermata-busta");
      const dettagli = document.getElementById("schermata-dettagli");
      const videoFinale = document.getElementById("bg-video-finale");
      const bgAudio = document.getElementById("bg-audio");

      if (bgAudio) {
        bgAudio.play().catch(function(e) {
          console.log("Riproduzione audio impedita dal browser:", e);
        });
      }

      if (videoFinale) {
        videoFinale.play().catch(function(e) { console.log(e); });
      }

      dettagli.style.opacity = "1";
      busta.style.opacity = "0";

      setTimeout(() => {
        busta.style.display = "none";
      }, 1000);
    }

    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('active');
      }, 10);
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.remove('active');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 300);
    }

    function closeModalOnOuterClick(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    }
  </script>

</body>
</html>
