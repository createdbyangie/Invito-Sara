<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invito 18 Anni - Sara</title>
  
  <!-- Import dei font Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playball&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playball', cursive;
      background-color: #000;
    }

    /* --- SCHERMATA 1: BUSTA (INALTERATA) --- */
    #schermata-busta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-in-out;
      z-index: 10;
      background-color: #f7e6e9;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    .testo-container {
      position: absolute;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 2.2rem;
      line-height: 1.3;
      z-index: 3;
      color: #000000;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .char-fade {
      display: inline-block;
      opacity: 0;
      animation: fadeInChar 0.4s forwards ease-in-out;
    }

    @keyframes fadeInChar {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .area-busta-pulsante {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }


    /* --- SCHERMATA 2: VIDEO FINALE E AREE CLICCABILI TRASPARENTI --- */
    #schermata-dettagli {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 5;
      overflow: hidden;
    }

    #bg-video-finale {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Contenitore e posizionamento dei pulsanti trasparenti */
    .hotspots-container {
      position: absolute;
      z-index: 3;
      width: 75%;
      max-width: 280px;
      height: 200px;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
    }

    .hotspot-btn {
      position: absolute;
      width: 100%;
      height: 45px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    /* Posizione dei tre tasti all'interno del blocco */
    #hotspot-dresscode {
      top: 0px;
    }
    #hotspot-location {
      top: 70px;
    }
    #hotspot-conferma {
      top: 140px;
    }


    /* POP-UP MODALE DRESS CODE (SOLO GRAFICA) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      position: relative;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .popup-graphic {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      color: #666;
      cursor: pointer;
      line-height: 1;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA 1: VIDEO + BUSTA -->
  <div id="schermata-busta">
    <div id="audio-btn" onclick="toggleAudio(event)">🔇</div>
    <video id="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div id="scritta" class="testo-container"></div>
    <div class="area-busta-pulsante" onclick="apriInvito()"></div>
  </div>

  <!-- SCHERMATA 2: SECONDA PARTE CON VIDEO FINALE -->
  <div id="schermata-dettagli">
    <!-- Senza loop: il video si ferma sull'ultimo fotogramma -->
    <video id="bg-video-finale" muted playsinline webkit-playsinline preload="auto">
      <source src="videofinale.mp4" type="video/mp4">
    </video>

    <div class="hotspots-container">
      <!-- 1. Tasto Dress Code -->
      <button id="hotspot-dresscode" class="hotspot-btn" onclick="openModal('dresscode-modal')"></button>
      
      <!-- 2. Tasto Location -->
      <a id="hotspot-location" href="https://maps.google.com/?q=Villa+Brusa+Villabate" target="_blank" class="hotspot-btn"></a>
      
      <!-- 3. Tasto Conferma Presenza -->
      <a id="hotspot-conferma" href="https://docs.google.com/forms/d/e/1FAIpQLSfMXxNJMhYbVsZIxITV36BCIWxzh7P6D4XMae4woPi9Cz0t_Q/viewform?usp=header" target="_blank" class="hotspot-btn"></a>
    </div>
  </div>

  <!-- POP-UP DRESS CODE -->
  <div id="dresscode-modal" class="modal" onclick="closeModalOnOuterClick(event, 'dresscode-modal')">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('dresscode-modal')">&times;</span>
      <img src="dresscode.png" alt="Dress Code" class="popup-graphic" onerror="this.style.display='none'">
    </div>
  </div>

  <script>
    const testo = "Clicca sulla busta\nper aprire l’invito.";
    const container = document.getElementById("scritta");
    let index = 0;

    function scriviTestoFluido() {
      if (index < testo.length) {
        const char = testo.charAt(index);
        const span = document.createElement("span");
        
        if (char === "\n") {
          container.appendChild(document.createElement("br"));
        } else {
          if (char === " ") {
            span.innerHTML = "&nbsp;";
          } else {
            span.textContent = char;
          }
          span.className = "char-fade";
          container.appendChild(span);
        }
        
        index++;
        setTimeout(scriviTestoFluido, 70);
      }
    }

    function toggleAudio(event) {
      event.stopPropagation();
      const video = document.getElementById("bg-video");
      const audioBtn = document.getElementById("audio-btn");
      
      if (video.muted) {
        video.muted = false;
        audioBtn.textContent = "🔊";
      } else {
        video.muted = true;
        audioBtn.textContent = "🔇";
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      video.play().catch(function(error) {
        console.log("Autoplay gestito dal browser");
      });
      scriviTestoFluido();
    });

    function apriInvito() {
      const busta = document.getElementById("schermata-busta");
      const dettagli = document.getElementById("schermata-dettagli");
      const videoFinale = document.getElementById("bg-video-finale");

      if (videoFinale) {
        videoFinale.play().catch(function(e) { console.log(e); });
      }

      dettagli.style.opacity = "1";
      busta.style.opacity = "0";

      setTimeout(() => {
        busta.style.display = "none";
      }, 1000);
    }

    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('active');
      }, 10);
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.remove('active');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 300);
    }

    function closeModalOnOuterClick(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    }
  </script>

</body>
</html>
