<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invito 18 Anni - Sara</title>
  
  <!-- Import del font Playball da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playball', cursive;
      background-color: #f7e6e9;
    }

    /* --- SCHERMATA 2 (DETTAGLI) SOTTOSTANTE PER DISSOLVENZA --- */
    #schermata-dettagli {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      background: url('sfondo-dettagli.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 5;
      text-align: center;
      color: #1a1a1a;
      padding: 20px;
    }

    /* --- PRIMA SCHERMATA (VIDEO + BUSTA) SOPRA --- */
    #schermata-busta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-in-out;
      z-index: 10;
      background-color: #f7e6e9;
      overflow: hidden;
    }

    /* Video in background a schermo intero reale */
    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Tasto Audio non invasivo (in alto a destra) */
    #audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    /* Contenitore Scritta: Testo Nero pulito, SENZA OMBRE */
    .testo-container {
      position: absolute;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 2.2rem;
      line-height: 1.3;
      z-index: 3;
      color: #000000;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .char-fade {
      display: inline-block;
      opacity: 0;
      animation: fadeInChar 0.4s forwards ease-in-out;
    }

    @keyframes fadeInChar {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Area Cliccabile della Busta */
    .area-busta-pulsante {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }

    /* Stili Seconda Schermata (Dettagli) */
    .sottotitolo {
      font-size: 1.3rem;
      margin-bottom: 5px;
      letter-spacing: 2px;
      color: #333;
    }

    .titolo-evento {
      font-size: 3.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .data-ora {
      font-size: 1.4rem;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .bottoni-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .bottone-tondo {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 1rem;
      font-weight: bold;
      font-family: sans-serif;
      letter-spacing: 1px;
    }

    .cerchio-icona {
      width: 60px;
      height: 60px;
      border: 2px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1.4rem;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .scadenza-rsvp {
      font-family: sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.15);
      border-bottom: 1px solid rgba(0,0,0,0.15);
      padding: 8px 15px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA 1: VIDEO + BUSTA -->
  <div id="schermata-busta">
    <!-- Tasto Audio discreto -->
    <div id="audio-btn" onclick="toggleAudio(event)">🔇</div>

    <!-- Video in loop -->
    <video id="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>

    <div id="scritta" class="testo-container"></div>
    <div class="area-busta-pulsante" onclick="apriInvito()"></div>
  </div>

  <!-- SCHERMATA 2: DETTAGLI EVENTO -->
  <div id="schermata-dettagli">
    <div class="sottotitolo">Sei invitato al mio</div>
    <div class="titolo-evento">18° di Sara</div>
    <div class="data-ora">
      <strong>18 OTTOBRE 2026</strong><br>
      ORE 21:30
    </div>

    <div class="bottoni-container">
      <a href="#" class="bottone-tondo" onclick="alert('Dress Code: Total Black'); return false;">
        <div class="cerchio-icona">👗</div>
        DRESSCODE
      </a>

      <a href="https://maps.google.com/?q=TuoIndirizzo" target="_blank" class="bottone-tondo">
        <div class="cerchio-icona">📍</div>
        LOCATION
      </a>

      <a href="https://forms.gle/TuoLinkModulo" target="_blank" class="bottone-tondo">
        <div class="cerchio-icona">💌</div>
        CONFERMA
      </a>
    </div>

    <div class="scadenza-rsvp">
      CONFERMA LA TUA PARTECIPAZIONE ENTRO IL 15 SETTEMBRE
    </div>
  </div>

  <script>
    const testo = "Clicca sulla busta\nper aprire l’invito.";
    const container = document.getElementById("scritta");
    let index = 0;

    function scriviTestoFluido() {
      if (index < testo.length) {
        const char = testo.charAt(index);
        const span = document.createElement("span");
        
        if (char === "\n") {
          container.appendChild(document.createElement("br"));
        } else {
          if (char === " ") {
            span.innerHTML = "&nbsp;";
          } else {
            span.textContent = char;
          }
          span.className = "char-fade";
          container.appendChild(span);
        }
        
        index++;
        setTimeout(scriviTestoFluido, 70);
      }
    }

    function toggleAudio(event) {
      event.stopPropagation();
      const video = document.getElementById("bg-video");
      const audioBtn = document.getElementById("audio-btn");
      
      if (video.muted) {
        video.muted = false;
        audioBtn.textContent = "🔊";
      } else {
        video.muted = true;
        audioBtn.textContent = "🔇";
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      video.play().catch(function(error) {
        console.log("Autoplay gestito dal browser");
      });
      scriviTestoFluido();
    });

    function apriInvito() {
      const busta = document.getElementById("schermata-busta");
      const dettagli = document.getElementById("schermata-dettagli");

      dettagli.style.opacity = "1";
      busta.style.opacity = "0";

      setTimeout(() => {
        busta.style.display = "none";
      }, 1000);
    }
  </script>

</body>
</html>
