<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito 18 Anni - Sara</title>
  
  <!-- Import del font Playball da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playball', cursive;
      background-color: #f7e6e9;
    }

    /* --- PRIMA SCHERMATA (BUSTA) --- */
    #schermata-busta {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('sfondo.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: opacity 1s ease-in-out;
      z-index: 10;
    }

    /* Contenitore Scritta Iniziale ben distanziato in alto */
    .testo-container {
      margin-top: 6vh;
      width: 90%;
      text-align: center;
      font-size: 1.8rem;
      color: #1a1a1a;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
      white-space: pre-wrap;
    }

    /* Singola lettera animata con sfumatura morbida */
    .char-fade {
      display: inline-block;
      opacity: 0;
      animation: fadeInChar 0.4s forwards ease-in-out;
    }

    @keyframes fadeInChar {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Area Cliccabile della Busta con Pulsazione Leggera (Respiro) */
    .area-busta-pulsante {
      position: absolute;
      top: 48%;
      width: 260px;
      height: 180px;
      cursor: pointer;
      animation: pulsazioneBusta 2.5s infinite ease-in-out;
    }

    @keyframes pulsazioneBusta {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
      100% {
        transform: scale(1);
      }
    }

    /* --- SECONDA SCHERMATA (DETTAGLI) --- */
    #schermata-dettagli {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('sfondo-dettagli.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      z-index: 5;
      text-align: center;
      color: #1a1a1a;
      padding: 20px;
    }

    .sottotitolo {
      font-size: 1.3rem;
      margin-bottom: 5px;
      letter-spacing: 2px;
      color: #333;
    }

    .titolo-evento {
      font-size: 3.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .data-ora {
      font-size: 1.4rem;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    /* Bottoni Interattivi */
    .bottoni-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .bottone-tondo {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 1rem;
      font-weight: bold;
      font-family: sans-serif;
      letter-spacing: 1px;
    }

    .cerchio-icona {
      width: 60px;
      height: 60px;
      border: 2px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1.4rem;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bottone-tondo:active .cerchio-icona {
      transform: scale(0.92);
    }

    .scadenza-rsvp {
      font-family: sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.15);
      border-bottom: 1px solid rgba(0,0,0,0.15);
      padding: 8px 15px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA 1: BUSTA -->
  <div id="schermata-busta">
    <div id="scritta" class="testo-container"></div>
    <div class="area-busta-pulsante" onclick="apriInvito()"></div>
  </div>

  <!-- SCHERMATA 2: DETTAGLI EVENTO -->
  <div id="schermata-dettagli">
    <div class="sottotitolo">Sei invitato al mio</div>
    <div class="titolo-evento">18° di Sara</div>
    <div class="data-ora">
      <strong>18 OTTOBRE 2026</strong><br>
      ORE 21:30
    </div>

    <div class="bottoni-container">
      <!-- Dresscode -->
      <a href="#" class="bottone-tondo" onclick="alert('Dress Code: Total Black'); return false;">
        <div class="cerchio-icona">👗</div>
        DRESSCODE
      </a>

      <!-- Location -->
      <a href="https://maps.google.com/?q=TuoIndirizzo" target="_blank" class="bottone-tondo">
        <div class="cerchio-icona">📍</div>
        LOCATION
      </a>

      <!-- Conferma -->
      <a href="https://forms.gle/TuoLinkModulo" target="_blank" class="bottone-tondo">
        <div class="cerchio-icona">💌</div>
        CONFERMA
      </a>
    </div>

    <div class="scadenza-rsvp">
      CONFERMA LA TUA PARTECIPAZIONE ENTRO IL 15 SETTEMBRE
    </div>
  </div>

  <script>
    const testo = "Clicca sulla busta per aprire l’invito.";
    const container = document.getElementById("scritta");
    let index = 0;

    function scriviTestoFluido() {
      if (index < testo.length) {
        const char = testo.charAt(index);
        const span = document.createElement("span");
        
        if (char === " ") {
          span.innerHTML = "&nbsp;";
        } else {
          span.textContent = char;
        }
        
        span.className = "char-fade";
        container.appendChild(span);
        
        index++;
        setTimeout(scriviTestoFluido, 70);
      }
    }

    window.onload = scriviTestoFluido;

    function apriInvito() {
      const busta = document.getElementById("schermata-busta");
      const dettagli = document.getElementById("schermata-dettagli");

      busta.style.opacity = "0";
      setTimeout(() => {
        busta.style.display = "none";
        dettagli.style.pointerEvents = "auto";
        dettagli.style.opacity = "1";
      }, 1000);
    }
  </script>

</body>
</html>
