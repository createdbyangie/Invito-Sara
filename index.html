<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invito 18 Anni - Sara</title>
  
  <!-- Import dei font Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playball&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playball', cursive;
      background-color: #000;
    }

    /* --- PRIMA SCHERMATA (VIDEO + BUSTA) INALTERATA --- */
    #schermata-busta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-in-out;
      z-index: 10;
      background-color: #f7e6e9;
      overflow: hidden;
    }

    /* Video prima schermata */
    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Tasto Audio discreto */
    #audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    /* Scritta animata sulla busta */
    .testo-container {
      position: absolute;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 2.2rem;
      line-height: 1.3;
      z-index: 3;
      color: #000000;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .char-fade {
      display: inline-block;
      opacity: 0;
      animation: fadeInChar 0.4s forwards ease-in-out;
    }

    @keyframes fadeInChar {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Area Cliccabile della Busta */
    .area-busta-pulsante {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }


    /* --- SECONDA SCHERMATA CON NUOVO VIDEO FINALE E TASTI --- */
    #schermata-dettagli {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 50px;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 5;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* Nuovo Video Finale per la seconda parte */
    #bg-video-finale {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Overlay per rendere ben visibili i pulsanti */
    .overlay-dettagli {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.4) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Contenitore Pulsanti Interattivi */
    .bottoni-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 80%;
      max-width: 320px;
    }

    .btn-interattivo {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 14px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      text-decoration: none;
      display: block;
    }

    .btn-interattivo:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.35);
    }

    /* POP-UP MODALE DRESS CODE */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      position: relative;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .popup-graphic {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
      display: block;
    }

    .modal-text {
      color: #333;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .highlight-font {
      font-family: 'Playball', cursive;
      font-size: 28px;
      color: #000;
      display: block;
      margin-top: 5px;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 24px;
      color: #666;
      cursor: pointer;
      line-height: 1;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA 1: VIDEO + BUSTA -->
  <div id="schermata-busta">
    <!-- Tasto Audio discreto -->
    <div id="audio-btn" onclick="toggleAudio(event)">🔇</div>

    <!-- Video prima schermata -->
    <video id="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>

    <div id="scritta" class="testo-container"></div>
    <div class="area-busta-pulsante" onclick="apriInvito()"></div>
  </div>

  <!-- SCHERMATA 2: SECONDA PARTE CON NUOVO VIDEO FINALE E TASTI -->
  <div id="schermata-dettagli">
    <!-- Nuovo video di sfondo finale -->
    <video id="bg-video-finale" loop muted playsinline webkit-playsinline preload="auto">
      <source src="videofinale.mp4" type="video/mp4">
    </video>

    <div class="overlay-dettagli"></div>

    <!-- Tasti Interattivi -->
    <div class="bottoni-container">
      <button class="btn-interattivo" onclick="openModal('dresscode-modal')">Dress Code</button>
      <a href="https://maps.google.com/?q=Villa+Brusa+Villabate" target="_blank" class="btn-interattivo">Location</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfMXxNJMhYbVsZIxITV36BCIWxzh7P6D4XMae4woPi9Cz0t_Q/viewform?usp=header" target="_blank" class="btn-interattivo">Conferma Presenza</a>
    </div>
  </div>

  <!-- POP-UP DRESS CODE CON GRAFICA E FONT PLAYBALL -->
  <div id="dresscode-modal" class="modal" onclick="closeModalOnOuterClick(event, 'dresscode-modal')">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('dresscode-modal')">&times;</span>
      
      <!-- Grafica carica su GitHub come dresscode -->
      <img src="dresscode.png" alt="Dress Code" class="popup-graphic" onerror="this.style.display='none'">

      <p class="modal-text">
        La regola d'oro della serata: banditi i colori...
        <span class="highlight-font">Total Black</span>
      </p>
    </div>
  </div>

  <script>
    const testo = "Clicca sulla busta\nper aprire l’invito.";
    const container = document.getElementById("scritta");
    let index = 0;

    function scriviTestoFluido() {
      if (index < testo.length) {
        const char = testo.charAt(index);
        const span = document.createElement("span");
        
        if (char === "\n") {
          container.appendChild(document.createElement("br"));
        } else {
          if (char === " ") {
            span.innerHTML = "&nbsp;";
          } else {
            span.textContent = char;
          }
          span.className = "char-fade";
          container.appendChild(span);
        }
        
        index++;
        setTimeout(scriviTestoFluido, 70);
      }
    }

    function toggleAudio(event) {
      event.stopPropagation();
      const video = document.getElementById("bg-video");
      const audioBtn = document.getElementById("audio-btn");
      
      if (video.muted) {
        video.muted = false;
        audioBtn.textContent = "🔊";
      } else {
        video.muted = true;
        audioBtn.textContent = "🔇";
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      video.play().catch(function(error) {
        console.log("Autoplay gestito dal browser");
      });
      scriviTestoFluido();
    });

    /* Transizione al click della busta */
    function apriInvito() {
      const busta = document.getElementById("schermata-busta");
      const dettagli = document.getElementById("schermata-dettagli");
      const videoFinale = document.getElementById("bg-video-finale");

      // Avvia la riproduzione del video finale
      if (videoFinale) {
        videoFinale.play().catch(function(e) { console.log(e); });
      }

      dettagli.style.opacity = "1";
      busta.style.opacity = "0";

      setTimeout(() => {
        busta.style.display = "none";
      }, 1000);
    }

    /* Gestione Pop-up Modale */
    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('active');
      }, 10);
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.remove('active');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 300);
    }

    function closeModalOnOuterClick(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    }
  </script>

</body>
</html>
